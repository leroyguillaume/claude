name: quality

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # For the external-link check below: upstream reorganises its docs and the
    # link dies without any file here changing.
    - cron: "41 4 * * 2"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-24.04
    steps:
      - name: check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          # Minor-pinned: pre-commit builds its hook environments with this
          # interpreter, so a floating version changes them under a green tree.
          python-version: "3.13"

      - name: install pre-commit
        run: python -m pip install --requirement .github/requirements.txt

      - name: run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  tests:
    runs-on: ubuntu-24.04
    steps:
      - name: check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: run the script tests
        run: |
          for test in tests/*.sh; do
            "$test"
          done

  skills:
    runs-on: ubuntu-24.04
    steps:
      - name: check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Dependabot cannot bump a version inside a `run:` line, so read the one it
      # does bump: the release in the `# frozen: vX.Y.Z` comment of the hook's
      # `rev` in .pre-commit-config.yaml.
      - name: read the pinned skill-validator release
        id: skill-validator
        run: |
          version="$(yq '.repos[] | select(.repo == "https://github.com/agent-ecosystem/skill-validator") | .rev | line_comment' .pre-commit-config.yaml)"
          echo "version=${version#frozen: }" >> "$GITHUB_OUTPUT"

      - name: validate the skills with skill-validator and pollen
        uses: groupbees/skill-action@0e139db79d4d635ee7ffc973008e56e0e07da4a1  # v0.1.0
        with:
          skill-validator-version: ${{ steps.skill-validator.outputs.version }}

      # `check` only resolves relative links. This one hits the network, which
      # is why it lives here and not in a pre-commit hook.
      - name: check the external links
        if: ${{ !cancelled() }}
        run: skill-validator validate links --emit-annotations skills/
