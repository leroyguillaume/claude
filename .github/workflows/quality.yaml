name: quality

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # For the external-link check below: upstream reorganises its docs and the
    # link dies without any file here changing.
    - cron: "41 4 * * 2"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-24.04
    steps:
      - name: check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: install the tools
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a  # v5.2.10
        with:
          cache: false

      - name: run pre-commit
        run: task lint

  tests:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: install the tools
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a  # v5.2.10
        with:
          cache: false
          install_args: jq task

      - name: run the script tests
        run: task test

  skills:
    runs-on: ubuntu-24.04
    steps:
      - name: check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: install the tools
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a  # v5.2.10
        with:
          cache: false
          install_args: github:agent-ecosystem/skill-validator task

      - name: read the pinned skill-validator release
        id: skill-validator
        run: echo "version=v$(mise current github:agent-ecosystem/skill-validator)" >> "$GITHUB_OUTPUT"

      - name: validate the skills with skill-validator and pollen
        uses: groupbees/skill-action@0e139db79d4d635ee7ffc973008e56e0e07da4a1  # v0.1.0
        with:
          skill-validator-version: ${{ steps.skill-validator.outputs.version }}

      # `check` only resolves relative links. This one hits the network, which
      # is why it lives here and not in a pre-commit hook.
      - name: check the external links
        if: ${{ !cancelled() }}
        run: task links -- --emit-annotations
